name: Live NCBI validation (on demand)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Public repository: contact details come from Actions secrets only.
      NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      NCBI_TOOL: ${{ secrets.NCBI_TOOL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip check
      - name: Warn when NCBI_EMAIL secret is missing
        shell: bash
        run: |
          email="${NCBI_EMAIL//[[:space:]]/}"
          if [ -z "$email" ]; then
            echo "::warning title=Missing NCBI_EMAIL::Repository secret NCBI_EMAIL is not set. Add it under Settings > Secrets and variables > Actions so NCBI E-utilities requests include a monitored contact email. This job continues with the non-personal default contact."
          fi
      - name: Query real NCBI ESearch and EFetch
        run: python live_ncbi_validation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ncbi-live-validation
          path: ncbi_live_results.json
