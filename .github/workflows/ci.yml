name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.lock ] && python -m pip install -r requirements.lock; then
            echo "Installed dependencies from requirements.lock"
          else
            echo "::warning title=Lockfile install failed::Could not install from requirements.lock; falling back to requirements.txt"
            python -m pip install -r requirements.txt
          fi

      - name: Run Pytest
        run: |
          python -m pytest
